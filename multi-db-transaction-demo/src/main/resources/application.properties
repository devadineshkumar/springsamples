spring.application.name=transaction-demo

# MySQL datasource (external)
app.datasource.mysql.url=jdbc:mysql://172.18.247.175:3306/testdb?useSSL=false&serverTimezone=UTC
app.datasource.mysql.username=root
app.datasource.mysql.password=demo
app.datasource.mysql.driver-class-name=com.mysql.cj.jdbc.Driver
app.datasource.mysql.jpa.hibernate.ddl-auto=update
app.datasource.mysql.jpa.show-sql=true
app.datasource.mysql.jpa.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# H2 datasource (in-memory)
app.datasource.h2.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
app.datasource.h2.username=sa
app.datasource.h2.password=sa
app.datasource.h2.driver-class-name=org.h2.Driver
app.datasource.h2.jpa.hibernate.ddl-auto=create-drop
app.datasource.h2.jpa.show-sql=true
app.datasource.h2.jpa.hibernate.dialect=org.hibernate.dialect.H2Dialect
