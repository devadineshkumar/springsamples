apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-springhelm
  namespace: default
  labels:
    app: spring-helm-app
    release: springhelm
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/use-regex: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - springhelm.example.com
      secretName: springhelm-tls
  rules:
    - host: springhelm.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: service-springhelm
                port:
                  number: 80
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: service-springhelm
                port:
                  number: 80
