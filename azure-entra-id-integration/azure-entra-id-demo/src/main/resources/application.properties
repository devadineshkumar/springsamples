spring.application.name=demo

# MSAL (server-side Java using msal4j) configuration
# Replace these values with your Azure App Registration values
# msal.client-id         -> Application (client) ID
# msal.client-secret     -> Client secret (if confidential client)
# msal.tenant-id         -> Tenant ID or 'common'
# msal.authority         -> Authority/issuer base (constructed from tenant if omitted)
# msal.scopes            -> Comma-separated list of scopes requested (will be converted to space-separated when building authorize URL)
# msal.redirect-uri      -> Callback URL that you must register in Azure App Registration (Web platform)

msal.client-id=${azure.client-id:}
msal.client-secret=${azure.client-secret:}
msal.tenant-id=${azure.tenant-id:common}
msal.authority=https://login.microsoftonline.com/${azure.tenant-id}
msal.scopes=openid,profile,email,offline_access,User.Read
msal.redirect-uri=http://localhost:8080/msal/callback

# If you previously used Spring Boot's built-in OAuth2 client (OpenID Connect), keep those properties commented out
# to avoid the automatic Spring oauth2Login handling while you focus on the MSAL server-side flow.
#spring.security.oauth2.client.registration.azure.client-id=${azure.client-id}
#spring.security.oauth2.client.registration.azure.client-secret=${azure.client-secret}
#spring.security.oauth2.client.registration.azure.scope=openid,profile,email
#spring.security.oauth2.client.provider.azure.issuer-uri=https://login.microsoftonline.com/${azure.tenant-id:common}/v2.0
#spring.security.oauth2.client.registration.azure.redirect-uri=http://localhost:8080/login/oauth2/code/azure

# Debug logging to help troubleshoot MSAL flows
logging.level.org.springframework.security=DEBUG
logging.level.com.azure.demo=DEBUG
logging.level.org.springframework.web=DEBUG
