# Example SSL/HTTPS Configuration for Spring Boot
# This file shows how to configure your Spring Boot application to use HTTPS
# After generating your keystore using generate-keystore.bat or generate-keystore-quick.bat

# Enable SSL
server.ssl.enabled=true

# Path to your keystore file (place it in src/main/resources)
server.ssl.key-store=classpath:keystore.p12

# Keystore password (change if you used a different password)
server.ssl.key-store-password=changeit

# Keystore type
server.ssl.key-store-type=PKCS12

# Alias used when generating the keystore
server.ssl.key-alias=springboot

# HTTPS port (default HTTPS port is 8443)
server.port=8443

# Optional: Redirect HTTP to HTTPS (uncomment if needed)
# server.http.port=8080

# Optional: Enable HTTP/2 support (uncomment if needed)
# server.http2.enabled=true

# Note: After applying these settings:
# 1. Move your keystore.p12 file to src/main/resources/
# 2. Run: mvn spring-boot:run
# 3. Access your app at: https://localhost:8443
# 4. You'll see a browser security warning (normal for self-signed certificates)
# 5. Click "Advanced" and proceed to accept the certificate
